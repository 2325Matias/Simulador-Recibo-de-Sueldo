<!DOCTYPE html>
<html lang="es">
<head>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body class="bg-modern-flat min-vh-100 d-flex align-items-center py-5">

    <div class="row g-4 justify-content-center">
        <!-- Botón Opción 1 -->
        <div class="col-md-6">

                    <p class="text-muted small mb-4">Simulación estándar de haberes y deducciones de ley.</p>

        <div class="col-md-6">
